[project]
name = "fmcg_wms"
version = "0.5.6"
description = "Customer shipment and in-transit inventory controls for ERPNext"
requires-python = ">=3.10"
authors = [{ name = "快消品WMS系统" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
